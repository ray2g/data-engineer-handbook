# ═══════════════════════════════════════════════════════════════════
# Platform Properties — Dataproc Batch Configuration
# ═══════════════════════════════════════════════════════════════════
# This file controls how the training job is submitted to Google Cloud
# Dataproc Batch.  A corresponding .env file must also be configured
# (see .env.example in the same directory).
#
# Edit this file when you need to:
#   - Change the GCP project, region or bucket
#   - Use a different Docker container image
#   - Tune Dataproc worker resources
# ───────────────────────────────────────────────────────────────────

# ── GCP Project ──────────────────────────────────────────────
gcp:
  project_id: "your-gcp-project-id"
  region: "europe-west1"               # Dataproc Batch region
  staging_bucket: "gs://your-bucket/dataproc-staging"

# ── Dataproc Batch ───────────────────────────────────────────
dataproc:
  batch_id_prefix: "qpsacat-ml-train"  # Prefix for the batch job ID

  # Docker container image used by the Dataproc Batch job.
  # Build a new image with:
  #   docker build -t <IMAGE_URI> -f Dockerfile .
  #   docker push <IMAGE_URI>
  # Then update the URI below.
  container_image: "europe-docker.pkg.dev/your-gcp-project-id/your-repo/qpsacat-ml:latest"

  # Dataproc runtime version (must support the chosen container image)
  runtime_version: "2.2"

  # ── Executor resources ──────────────────────────────────────
  executor:
    instances: 4                       # Number of executor nodes
    machine_type: "n1-standard-8"      # vCPUs and RAM per executor
    disk_size_gb: 100                  # Boot disk size per executor

  # ── Driver resources ────────────────────────────────────────
  driver:
    machine_type: "n1-standard-4"
    disk_size_gb: 50

  # ── Spark properties ────────────────────────────────────────
  spark_properties:
    spark.executor.memory: "24g"
    spark.driver.memory: "12g"
    spark.executor.cores: "4"
    spark.sql.shuffle.partitions: "200"

# ── MLflow ────────────────────────────────────────────────────
mlflow:
  tracking_uri: "https://your-mlflow-server/mlflow"
  # Credentials are injected at runtime from the .env file

# ── BigQuery ──────────────────────────────────────────────────
bigquery:
  dataset: "your_dataset"
  location: "EU"

# ── Logging ───────────────────────────────────────────────────
logging:
  level: "INFO"
  gcs_log_path: "gs://your-bucket/logs/training"
